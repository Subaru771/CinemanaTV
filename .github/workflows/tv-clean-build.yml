name: CinemanaTV v1.21 TV — Clean + Update Notifications

on:
  push:
    branches:
      - build/tv-clean-episodes-fast
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract source and remove alternatives
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tv-project"
          unzip -q downloads/CinemanaTV-v1.4.3-SOURCE.zip -d "$RUNNER_TEMP/tv-project"
          PROJECT_FILE="$(find "$RUNNER_TEMP/tv-project" -name settings.gradle.kts -print -quit)"
          test -n "$PROJECT_FILE"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          python3 tools/clean_tv.py "$PROJECT_DIR"
          grep -q 'versionName = "1.21"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 127' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'raw.githubusercontent.com/Subaru771/CinemanaTV/main/updates/tv.json' "$PROJECT_DIR/app/build.gradle.kts"
          if grep -RE 'CeeAlternativeSource|CeeWebRoutes|CeeWebScreen|AlternativeSourceDialog' "$PROJECT_DIR/app/src/main/java"; then
            echo 'ERROR: Orphaned alternative-source code'
            exit 1
          fi
      - name: Test and assemble release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/CinemanaTV-v1.21-TV-Fast-All-Episodes.apk"
          cd "$GITHUB_WORKSPACE/output"
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: CinemanaTV-v1.21-TV-Fast-All-Episodes
          path: output/
          if-no-files-found: error
          retention-days: 30
